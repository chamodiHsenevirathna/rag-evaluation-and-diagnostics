<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">Top-K trade-off</title><desc id="d">Evidence recall rises from 0.58 to 1.00, irrelevant chunks per question from 0.35 to 6.67, answerable accuracy from 0.37 to 0.44 and is flat after K=3.</desc><rect width="1000" height="360" fill="#fcfcfb"/><text x="30.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Retrieving more raised evidence recall and noise together; accuracy stopped improving at K = 3</text><text x="30.0" y="56.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Stored experiment results (not included in this release): default extractive reader, 40 cases. Top-K = number of chunks given to the reader.</text><text x="60.0" y="76.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Evidence recall</text><line x1="60" y1="280.0" x2="330" y2="280.0" stroke="#e4e3df" stroke-width="1"/><text x="54.0" y="284.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0</text><line x1="60" y1="232.5" x2="330" y2="232.5" stroke="#e4e3df" stroke-width="1"/><text x="54.0" y="236.5" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.25</text><line x1="60" y1="185.0" x2="330" y2="185.0" stroke="#e4e3df" stroke-width="1"/><text x="54.0" y="189.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.5</text><line x1="60" y1="137.5" x2="330" y2="137.5" stroke="#e4e3df" stroke-width="1"/><text x="54.0" y="141.5" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.75</text><line x1="60" y1="90.0" x2="330" y