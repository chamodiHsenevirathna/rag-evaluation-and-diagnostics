<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Baseline versus revised accuracy on the fresh validation set</title><desc id="d">Baseline 91 of 120 correct (75.8%), revised 78 of 120 (65.0%); revised is worse.</desc><rect width="1000" height="330" fill="#fcfcfb"/><text x="30.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">On a fresh 120-scenario validation set, the revised system was less accurate than the baseline</text><text x="30.0" y="56.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Outcome accuracy with Wilson 95% intervals. Source: stored analysis of the fresh validation set (not included in this release); run once, pre-registered.</text><line x1="250.0" y1="100" x2="250.0" y2="240" stroke="#e4e3df"/><text x="250.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0%</text><line x1="388.0" y1="100" x2="388.0" y2="240" stroke="#e4e3df"/><text x="388.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">20%</text><line x1="526.0" y1="100" x2="526.0" y2="240" stroke="#e4e3df"/><text x="526.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">40%</text><line x1="664.0" y1="100" x2="664.0" y2="240" stroke="#e4e3df"/><text x="664.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">60%</text><line x1="802.0" y1="100" x2="802.0" y2="240" stroke="#e4e3df"/><text x="802.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">80%</text><line x1="940.0" y1="100" x2="940.0" y2="240" stroke="#e4e3df"/><text x="940.0" y="258.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">100%</text><text x="238.0" y="134.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Baseline</text><rect x="250" y="110" width="523.2" height="34" rx="4" fill="#2a78d6"/><line x1="715.4" y1="127" x2="820.0" y2="127" stroke="#0b0b0b" stroke-width="2"/><line x1="715.4" y1="119" x2="715.4" y2="135" stroke="#0b0b0b" stroke-width="2"/><line x1="820.0" y1="119" x2="820.0" y2="135" stroke="#0b0b0b" stroke-width="2"/><text x="828.0" y="132.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">91/120 = 75.8%</text><text x="238.0" y="194.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Revised (outcome-v2.0 system)</text><rect x="250" y="170" width="448.5" height="34" rx="4" fill="#eb6834"/><line x1="637.2" y1="187" x2="753.4" y2="187" stroke="#0b0b0b" stroke-width="2"/><line x1="637.2" y1="179" x2="637.2" y2="195" stroke="#0b0b0b" stroke-width="2"/><line x1="753.4" y1="179" x2="753.4" y2="195" stroke="#0b0b0b" stroke-width="2"/><text x="761.4" y="192.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">78/120 = 65.0%</text><text x="250.0" y="286.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Difference -0.108 (paired-bootstrap 95% interval -0.183 to -0.033); exact McNemar p = 0.0106; 5 scenarios improved, 18 regressed.</text><text x="250.0" y="306.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Control-stratum guardrail failed. Pre-registered verdict: worse.</text></svg>