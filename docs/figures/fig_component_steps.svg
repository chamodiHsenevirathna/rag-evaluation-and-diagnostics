<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="t d"><title id="t">Component-level changes on the fresh validation set</title><desc id="d">Outcome rule: 2 improved, 15 regressed; all five together: 5 improved, 18 regressed.</desc><rect width="1120" height="420" fill="#fcfcfb"/><text x="30.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Which change cost accuracy? Adding components one at a time, on the same 120 scenarios</text><text x="30.0" y="56.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Each row adds one component to the previous row's system. Bars count scenarios whose outcome changed. Source: stored component-matrix results (not included in this release).</text><text x="688.0" y="92.0" font-size="12" fill="#eb6834" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, sans-serif">regressed (right to wrong)</text><text x="712.0" y="92.0" font-size="12" fill="#2a78d6" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">improved (wrong to right)</text><line x1="700" y1="100" x2="700" y2="418" stroke="#52514e" stroke-width="1"/><text x="258.0" y="132.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Outcome rule (v1 to v2.0)</text><rect x="366.0" y="112" width="330.0" height="28" rx="3" fill="#eb6834"/><text x="360.0" y="131.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, sans-serif">15</text><rect x="704" y="112" width="44.0" height="28" rx="3" fill="#2a78d6"/><text x="754.0" y="131.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">2</text><text x="1090.0" y="131.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">-0.108  (p = 0.00235)</text><text x="258.0" y="184.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Lexical judge (v1 to v2.0)</text><rect x="630.0" y="164" width="66.0" height="28" rx="3" fill="#eb6834"/><text x="624.0" y="183.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, sans-serif">3</text><rect x="704" y="164" width="66.0" height="28" rx="3" fill="#2a78d6"/><text x="776.0" y="183.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">3</text><text x="1090.0" y="183.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">+0.000  (p = 1)</text><text x="258.0" y="236.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Claim extractor (v1 to v2.0)</text><text x="690.0" y="235.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0</text><rect x="704" y="216" width="44.0" height="28" rx="3" fill="#2a78d6"/><text x="754.0" y="235.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">2</text><text x="1090.0" y="235.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">+0.017  (p = 0.5)</text><text x="258.0" y="288.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Abstention detector (v1 to v2.0)</text><rect x="652.0" y="268" width="44.0" height="28" rx="3" fill="#eb6834"/><text x="646.0" y="287.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, sans-serif">2</text><text x="710.0" y="287.0" font-size="13" fill="#52514e" text-anchor=