<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Interventions</title><desc id="d">Removing evidence cut accuracy from 0.375 to 0.075. Injecting a contradicting document left lenient accuracy at 0.375 while strict accuracy fell from 0.350 to 0.150.</desc><rect width="1000" height="400" fill="#fcfcfb"/><text x="30.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Two interventions: taking evidence away, and adding a document that contradicts it</text><text x="30.0" y="56.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Stored experiment results (not included in this release): 40 cases, extractive reader, lexical judge.</text><text x="30.0" y="88.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">A. Fraction of gold evidence removed from the corpus</text><line x1="70" y1="310.0" x2="380" y2="310.0" stroke="#e4e3df"/><text x="64.0" y="314.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.0</text><line x1="70" y1="260.0" x2="380" y2="260.0" stroke="#e4e3df"/><text x="64.0" y="264.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.1</text><line x1="70" y1="210.0" x2="380" y2="210.0" stroke="#e4e3df"/><text x="64.0" y="214.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.2</text><line x1="70" y1="160.0" x2="380" y2="160.0" stroke="#e4e3df"/><text x="64.0" y="164.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.3</text><line x1="70" y1="110.0" x2="380" y2="110.0" stroke="#e4e3df"/><text x="64.0" y="114.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.4</text><rect x="80" y="122.5" width="70" height="187.5" rx="4" fill="#2a78d6"/><text x="115.0" y="114.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">0.375</text><text x="115.0" y="328.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0% removed</text><text x="115.0" y="343.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">recall 0.95</text><rect x="190" y="272.5" width="70" height="37.5" rx="4" fill="#2a78d6"/><text x="225.0" y="264.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">0.075</text><text x="225.0" y="328.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">50% removed</text><text x="225.0" y="343.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">recall 0.22</text><rect x="300" y="272.5" width="70" height="37.5" rx="4" fill="#2a78d6"/><text x="335.0" y="264.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">0.075</text><text x="335.0" y="328.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">100% removed</text><text x="335.0" y="343.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">recall 0.00</text><text x="30.0" y="372.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Accuracy over all 40 cases (outcome-v1).</text><text x="540.0" y="88.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">B. One contradicting document injected into 18 cases</text><line x1="560" y1="310.0" x2="940" y2="310.0" stroke="#e4e3df"/><text x="554.0" y="314.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.0</text><line x1="560" y1="260.0" x2="940" y2="260.0" stroke="#e4e3df"/><text x="554.0" y="264.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.1</text><line x1="560" y1="210.0" x2="940" y2="210.0" stroke="#e4e3df"/><text x="554.0" y="214.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.2</text><line x1="560" y1="160.0" x2="940" y2="160.0" stroke="#e4e3df"/><text x="554.0" y="164.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.3</text><line x1="560" y1="110.0" x2="940" y2="110.0" stroke="#e4e3df"/><text x="554.0" y="114.0" font-size="10" fill="#52514e" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0.4</text><rect x="590" y="122.5" width="70" height="187.5" rx="4" fill="#2a78d6"/><text x="625.0" y="114.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">0.375</text><text x="625.0" y="328.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">lenient</text><rect x="670" y="135.0" width="70" height="175.0" rx="4" fill="#eb6834"/><text x="705.0" y="127.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">0.350</text><text x="705.0" y="328.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">strict</text><text x="665.0" y="348.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">no injection</text><rect x="780" y="122.5" width="70" height="187.5" rx="4" fill="#2a78d6"/><text x="815.0" y="114.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">0.375</text><text x="815.0" y="328.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">lenient</text><rect x="860" y="235.0" width="70" height="75.0" rx="4" fill="#eb6834"/><text x="895.0" y="227.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">0.150</text><text x="895.0" y="328.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">strict</text><text x="855.0" y="348.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, sans-serif">injected</text><text x="540.0" y="372.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Lenient = the original outcome rule (it ignores extra wrong claims).</text><text x="540.0" y="388.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Strict = also fails answers with hallucinated, noise-sourced or contradicted claims.</text></svg>